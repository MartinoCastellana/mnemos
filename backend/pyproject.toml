[project]
name = "document-ai-platform"
version = "1.0.0"
description = "Auditable document intelligence pipeline"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.12,<1",
  "pymupdf>=1.24,<2",
  "Pillow>=9.0",
  "numpy>=1.26",
  "opencv-contrib-python-headless>=4.10,<5",
  "torch>=2,<3",
  "transformers>=5.8,<6",
  "huggingface-hub>=1.0,<3",
  "safetensors>=0.4",
  "pydantic>=2,<3",
  "pytesseract>=0.3.13,<1",
  "PyYAML>=6.0",
  "requests>=2.28",
  "httpx>=0.27,<1",
  "alembic>=1.13,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.7,<1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "minicpmvocr*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["B008"]
